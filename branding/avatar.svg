<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <!-- Repository avatar: the watch with the app icon (palette «Лес»).
       Render with branding/render.sh (needs resvg). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#25594c"/>
      <stop offset="1" stop-color="#0c241e"/>
    </radialGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173f35"/>
      <stop offset="0.5" stop-color="#245a4b"/>
      <stop offset="1" stop-color="#173f35"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a9c87"/>
      <stop offset="1" stop-color="#1f5245"/>
    </linearGradient>
    <clipPath id="screen"><rect x="132" y="142" width="248" height="228" rx="58"/></clipPath>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="256" rx="170" ry="150" fill="#39b997" opacity="0.22" filter="url(#haze)"/>
  <path d="M186 40 h140 l-10 100 h-120 z" fill="url(#strap)"/>
  <path d="M196 372 h120 l10 100 h-140 z" fill="url(#strap)"/>
  <rect x="394" y="196" width="22" height="50" rx="8" fill="#4f8f7b"/>
  <rect x="396" y="270" width="14" height="40" rx="6" fill="#3f7d6b"/>
  <rect x="106" y="116" width="300" height="280" rx="78" fill="url(#case)"/>
  <rect x="124" y="134" width="264" height="244" rx="62" fill="#04120e"/>
  <image x="132" y="132" width="248" height="248" xlink:href="../BalanceWatch/Assets.xcassets/AppIcon.appiconset/BalanceIcon-1024.png" clip-path="url(#screen)"/>
</svg>
